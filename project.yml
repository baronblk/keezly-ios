# Keezly — XcodeGen project manifest.
#
# This file is the source of truth for the Xcode project. The generated
# Keezly.xcodeproj IS committed as well, so a plain `git clone` and Xcode Cloud
# both get a working project without extra tooling (DECISIONS.md → DEC-007).
#
# After editing this file:
#   xcodegen generate     # then commit project.yml AND Keezly.xcodeproj

name: Keezly

options:
  bundleIdPrefix: de.gcng
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

configFiles:
  Debug: Config/Keezly.xcconfig
  Release: Config/Keezly.xcconfig

packages:
  KeezlyCore:
    path: Packages/KeezlyCore

settings:
  base:
    # MARKETING_VERSION and CURRENT_PROJECT_VERSION deliberately live in
    # Config/Keezly.xcconfig, not here: a setting declared on the project wins
    # over any xcconfig, which would defeat the CI build-number override.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Warnings are signal, not noise: the quality gate requires a build with no
    # new warnings (§68).
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # DEVELOPMENT_TEAM is deliberately NOT set here. It is developer-specific,
    # and guessing a signing team is forbidden by the project rules. Supply it
    # in the git-ignored Config/Local.xcconfig (see Config/Local.xcconfig.example)
    # or let Xcode Cloud provide it (MAN-03).
    CODE_SIGN_STYLE: Automatic

targets:

  Keezly:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Keezly
    dependencies:
      - package: KeezlyCore
        product: KeezlyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gcng.keezly
        PRODUCT_NAME: Keezly
        # Game Center, matching the GAME_CENTER capability on the App ID.
        CODE_SIGN_ENTITLEMENTS: App/Keezly/Keezly.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Keezly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone and iPad. iPad is a first-class platform, not a side effect.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    info:
      path: App/Keezly/Info.plist
      properties:
        CFBundleDisplayName: Keezly
        # Dutch, German and English from the start (§54). The String Catalog
        # carries the translations; this is what makes the app offer them.
        CFBundleLocalizations: [en, de, nl]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Both landscape orientations must work (§5).
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required for Stage Manager and Split View to behave properly (§4).
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false

  KeezlyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/KeezlyTests
    dependencies:
      - target: Keezly
      - package: KeezlyCore
        product: KeezlyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gcng.keezly.tests
        GENERATE_INFOPLIST_FILE: YES

  KeezlyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/KeezlyUITests
    dependencies:
      - target: Keezly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gcng.keezly.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Keezly

schemes:

  # The shared scheme Xcode Cloud and fastlane build (§97).
  Keezly:
    build:
      targets:
        Keezly: all
        KeezlyTests: [test]
        KeezlyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Keezly
      # A test plan rather than a bare target list, because Xcode Cloud runs
      # the scheme's test action and would otherwise run the capture suite —
      # fourteen launches per device of screenshot fixtures, on every merge.
      # `DesignReviewScreenshots` is a capture suite, not a correctness suite;
      # what it produces is checked far more strictly on the files themselves
      # by `scripts/screenshots-verify.py`, and the `screenshots` lane runs it.
      #
      # The plan is also what makes the cloud and the desk run the same set.
      # They did not before, which is how Keezly Main build 15 failed on a
      # suite `fastlane ui_tests` never runs.
      # Two plans, because the two runs want different things.
      #
      #   Keezly.xctestplan             correctness. The default, so Xcode
      #                                 Cloud and `xcodebuild test` run it.
      #   Keezly-Screenshots.xctestplan the capture suite, and only that.
      #
      # A single plan that skipped the captures silently broke the screenshots
      # lane: `-only-testing` cannot re-enable something a plan has skipped, so
      # the run reported "Executed 0 tests" and succeeded, which is the worst
      # possible way to produce no screenshots.
      testPlans:
        - path: Keezly.xctestplan
          defaultPlan: true
        - path: Keezly-Screenshots.xctestplan
      targets:
        - KeezlyTests
        - KeezlyUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
